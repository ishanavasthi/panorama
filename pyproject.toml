[project]
name = "panorama"
version = "0.1.0"
description = "Cross-repo PR review CLI powered by the local Claude Code CLI."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12",
]

[project.scripts]
panorama = "panorama.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panorama"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The fixture data tree is not this project's source — it is a mock organisation
# written to look like somebody else's code, in three languages, and its exact
# contents are ground truth for the evaluation corpus. Linting it is wrong twice
# over: the style of a *fixture* is part of what is being measured (one case is
# a formatting-only control), and a lint autofix there would silently change a
# labelled case without touching a single label.
extend-exclude = ["src/panorama/fixtures/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists to catch a mutable default shared across calls. Typer's
# Option/Argument sentinels are the framework's designed way to declare a CLI
# parameter and are not shared state. Ruff only flags them on non-scalar
# annotations (a `Path` or `list[str]` option, not a `str` one), which would
# otherwise push every future command toward worse type annotations to stay
# quiet.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
